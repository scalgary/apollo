
services:
  web:
    build:
      context: ./my_app
      dockerfile: Dockerfile
    container_name: apollo-web
    ports:
      - "8000:8000"
    env_file:
      - ./my_app/.env
    restart: unless-stopped
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s