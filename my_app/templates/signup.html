<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Apollo</title>
    <link rel="stylesheet" href="/static/login.css">
</head>
    <div class="login-container">
        <div class="login-box">
        <h1>Apollo</h1>
        
        {% if request.query_params.get('error') %}
        <div class="error-message">{{ request.query_params.get('error') }}</div>
        {% endif %}
        
        <form method="POST" action="/auth/signup">
            <div class="form-group">
                <label>Email</label>
                <input type="email" name="email" required>
            </div>
            
            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" required minlength="6">
            </div>
                <div class="form-group">
        <label>Display Name (what others will see)</label>
        <input type="text" name="display_name" required maxlength="50">
        </div>
            <button type="submit" class="login-signup-btn">Sign Up</button>

        </form>
        
        <p class="signup-already_login-prompt">
            Already have an account? <a href="/auth/login">Login</a>
        </div>
    </div>
</body>
</html>
