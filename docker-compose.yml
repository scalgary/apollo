services:
  db:
    image: postgres:15-alpine
    container_name: apollo-db
    environment:
      POSTGRES_DB: apollo
      POSTGRES_USER: apollo
      POSTGRES_PASSWORD: apollo123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apollo"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    container_name: apollo-app
    build: ./my_app
    ports:
      - "8000:8000"
    volumes:
      - ./my_app:/app
    environment:
      DATABASE_URL: postgresql://apollo:apollo123@db:5432/apollo
      SECRET_KEY: your-secret-key-change-in-production
    depends_on:
      db:
        condition: service_healthy

  test:
    build: ./my_app
    command: pytest /app/tests -v --cov=.
    environment:
      # Utilise SQLite pour les tests (plus rapide, isolé)
      DATABASE_URL: sqlite:///./test.db
      SECRET_KEY: test-secret-key
    volumes:
      - ./my_app:/app
    # Pas besoin de depends_on si SQLite

volumes:
  postgres_data: